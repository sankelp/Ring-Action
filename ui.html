.3505%2056.3312%2042.6502%2056.3696%2044.7669%2055.6526C46.8835%2054.9356%2048.6864%2053.5073%2049.8686%2051.6108C51.0508%2049.7143%2051.5395%2047.4667%2051.2513%2045.2506M17.5002%2046.5C15.3723%2046.4999%2013.3039%2045.7977%2011.6158%2044.5023C9.92767%2043.2069%208.71412%2041.3907%208.16338%2039.3353C7.61264%2037.2799%207.75547%2035.1002%208.56972%2033.1343C9.38397%2031.1684%2010.8241%2029.5261%2012.6669%2028.462M17.505%2015.3854C16.0847%2015.7509%2014.7662%2016.4349%2013.6493%2017.3854C12.5325%2018.3359%2011.6465%2019.528%2011.0585%2020.8716C10.4706%2022.2152%2010.196%2023.6749%2010.2557%2025.1403C10.3154%2026.6057%2010.7077%2028.0383%2011.4029%2029.3296M25.3009%2029.2256L23.0703%2028.3001M25.3009%2034.7743L23.0703%2035.6999M39.2501%2032C39.2501%2036.0041%2036.0041%2039.25%2032.0001%2039.25C27.996%2039.25%2024.7501%2036.0041%2024.7501%2032C24.7501%2027.9959%2027.996%2024.75%2032.0001%2024.75C36.0041%2024.75%2039.2501%2027.9959%2039.2501%2032Z%22%20stroke-width%3D%224.83333%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20stroke%3D%22%235BC2E7%22%2F%3E%3C%2Fsvg%3E">
<style>
  /* ---------- tokens: Windows 11 materials, one accent ---------- */
  :root {
    color-scheme: light;
    --win:#f3f3f3; --frame:#f9f9f9; --frame-stroke:rgba(0,0,0,.06);
    --flyout:#fcfcfc; --flyout-stroke:rgba(0,0,0,.08);
    --ctrl:rgba(255,255,255,.7); --ctrl-hover:rgba(249,249,249,.5); --ctrl-solid:#ffffff;
    --stroke:rgba(0,0,0,.06); --stroke-b:rgba(0,0,0,.14);
    --fill-subtle:rgba(0,0,0,.037); --fill-subtle-2:rgba(0,0,0,.024);
    --text:rgba(0,0,0,.894); --text2:rgba(0,0,0,.62); --text3:rgba(0,0,0,.45);
    --divider:rgba(0,0,0,.07);
    --brand:#5BC2E7; --accent:#005fb8; --accent-hover:#1a6fc0; --accent-press:#3381c8; --on-accent:#fff;
    --accent-soft:rgba(0,95,184,.09);
    --seg:#ffffff; --seg-hover:#f2f4f7; --seg-stroke:rgba(0,0,0,.075);
    --danger:#c42b1c; --danger-soft:rgba(196,43,28,.08); --ok:#0f7b0f;
    --shadow-flyout:0 8px 16px rgba(0,0,0,.10), 0 0 1px rgba(0,0,0,.10);
    --shadow-dialog:0 32px 64px rgba(0,0,0,.18), 0 2px 21px rgba(0,0,0,.12);
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --font-small:"Segoe UI Variable Small","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,monospace;
    --glyphs:"Segoe Fluent Icons","Segoe MDL2 Assets";
    --spring:cubic-bezier(.32,.72,0,1);
    --out:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --win:#202020; --frame:#272727; --frame-stroke:rgba(255,255,255,.055);
      --flyout:#2c2c2c; --flyout-stroke:rgba(255,255,255,.08);
      --ctrl:rgba(255,255,255,.06); --ctrl-hover:rgba(255,255,255,.085); --ctrl-solid:#3a3a3a;
      --stroke:rgba(255,255,255,.07); --stroke-b:rgba(255,255,255,.05);
      --fill-subtle:rgba(255,255,255,.06); --fill-subtle-2:rgba(255,255,255,.04);
      --text:#ffffff; --text2:rgba(255,255,255,.77); --text3:rgba(255,255,255,.52);
      --divider:rgba(255,255,255,.07);
      --accent:#60cdff; --accent-hover:#5bbde9; --accent-press:#55acd3; --on-accent:#00131f;
      --accent-soft:rgba(96,205,255,.11);
      --seg:#313131; --seg-hover:#3a3a3a; --seg-stroke:rgba(255,255,255,.06);
      --danger:#ff99a4; --danger-soft:rgba(255,153,164,.1); --ok:#6ccb5f;
      --shadow-flyout:0 8px 16px rgba(0,0,0,.36), 0 0 1px rgba(0,0,0,.5);
      --shadow-dialog:0 32px 64px rgba(0,0,0,.5), 0 2px 21px rgba(0,0,0,.36);
    }
  }

  /* ---------- base ---------- */
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--win); color:var(--text); font:400 14px/20px var(--font); -webkit-font-smoothing:antialiased;
         display:grid; grid-template-columns:264px minmax(0,1fr); overflow:hidden; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--text); outline-offset:1px; border-radius:4px; }
  .g { font-family:var(--glyphs); font-style:normal; font-weight:400; font-size:16px; line-height:1; width:16px; text-align:center; flex:none; display:inline-block; }
  .muted { color:var(--text2); }
  .grow { flex:1; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-thumb { background:var(--text3); border-radius:6px; border:4px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ---------- controls ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:32px; padding:0 12px; border-radius:4px;
         border:1px solid var(--stroke); border-bottom-color:var(--stroke-b); background:var(--ctrl); white-space:nowrap;
         transition:background-color 120ms var(--out), transform 160ms var(--spring); }
  .btn:hover { background:var(--ctrl-hover); }
  .btn:active { transform:scale(.98); color:var(--text2); }
  .btn:disabled { color:var(--text3); cursor:default; transform:none; }
  .btn.accent { background:var(--accent); border-color:transparent; color:var(--on-accent); font-weight:600; }
  .btn.accent:hover { background:var(--accent-hover); }
  .btn.accent:active { background:var(--accent-press); color:var(--on-accent); }
  .btn.accent:disabled { background:var(--fill-subtle); color:var(--text3); }
  .btn.subtle { background:transparent; border-color:transparent; }
  .btn.subtle:hover { background:var(--fill-subtle); }
  .btn.danger { color:var(--danger); }
  .iconbtn { width:32px; height:32px; display:inline-grid; place-items:center; border:0; border-radius:4px; background:transparent; color:var(--text2);
             transition:background-color 120ms var(--out); }
  .iconbtn:hover { background:var(--fill-subtle); color:var(--text); }
  .iconbtn:active { background:var(--fill-subtle-2); }
  .iconbtn:disabled { color:var(--text3); cursor:default; background:transparent; }
  .iconbtn.sm { width:28px; height:28px; }
  .iconbtn.sm .g { font-size:13px; }

  .input { height:32px; width:100%; padding:0 11px; border-radius:4px; border:1px solid var(--stroke); border-bottom-color:var(--stroke-b);
           background:var(--ctrl); transition:background-color 120ms var(--out); }
  .input:hover { background:var(--ctrl-hover); }
  .input:focus { outline:none; background:var(--ctrl-solid); border-bottom-color:transparent; box-shadow:inset 0 -2px 0 var(--accent); }
  .input.mono { font:13px var(--mono); }
  .input::placeholder { color:var(--text3); }
  input[type=number].input { font-variant-numeric:tabular-nums; }

  kbd { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 7px; border-radius:4px;
        font:600 12px/1 var(--font-small); color:var(--text); background:var(--ctrl-solid);
        border:1px solid var(--stroke); border-bottom-width:2px; border-bottom-color:var(--stroke-b); }
  .caps { display:inline-flex; gap:4px; align-items:center; flex-wrap:wrap; }

  .keyfield { display:flex; align-items:center; gap:8px; min-height:40px; padding:4px 4px 4px 8px; border-radius:4px;
              border:1px solid var(--stroke); border-bottom-color:var(--stroke-b); background:var(--ctrl); cursor:pointer;
              transition:background-color 120ms var(--out), border-color 120ms var(--out); }
  .keyfield:hover { background:var(--ctrl-hover); }
  .keyfield .ph { color:var(--text3); flex:1; padding-left:3px; }
  .keyfield.rec { background:var(--accent-soft); border-color:var(--accent); cursor:default; }
  .keyfield.rec .live { flex:1; display:flex; align-items:center; gap:8px; padding-left:3px; }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--danger); flex:none; }

  .seg-ctl { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; padding:2px; border-radius:6px; background:var(--fill-subtle); }
  .seg-ctl label { position:relative; }
  .seg-ctl input { position:absolute; opacity:0; pointer-events:none; }
  .seg-ctl span { display:flex; align-items:center; justify-content:center; height:30px; padding:0 6px; border-radius:4px; font-size:13px; color:var(--text2);
                  cursor:pointer; transition:background-color 160ms var(--out), color 160ms var(--out); white-space:nowrap; }
  .seg-ctl label:hover span { color:var(--text); }
  .seg-ctl input:checked + span { background:var(--ctrl-solid); color:var(--text); font-weight:600;
                                  box-shadow:0 0 0 1px var(--stroke), 0 1px 2px rgba(0,0,0,.06); }
  .seg-ctl input:focus-visible + span { outline:2px solid var(--text); outline-offset:-2px; }

  .field { display:grid; gap:8px; margin-bottom:20px; }
  .field > .lbl { font-size:13px; font-weight:600; }
  .field > .help { color:var(--text2); font-size:12px; line-height:16px; margin-top:-2px; }

  /* ---------- sidebar ---------- */
  aside { display:flex; flex-direction:column; min-height:0; padding:4px 4px 8px; }
  .brand { display:flex; align-items:center; gap:12px; height:48px; padding:0 14px; font-size:13px; font-weight:600; }
  .brand svg { width:22px; height:22px; color:var(--brand); flex:none; }
  .sec { display:flex; align-items:center; justify-content:space-between; height:36px; padding:0 4px 0 14px; margin-top:4px;
         font-size:12px; font-weight:600; color:var(--text2); }
  nav { flex:1; overflow:auto; min-height:0; padding:0 4px; }
  .nav { position:relative; display:flex; align-items:center; gap:12px; width:100%; height:36px; padding:0 10px; margin:2px 0;
         border:0; border-radius:4px; background:transparent; text-align:left; transition:background-color 120ms var(--out); }
  .nav:hover { background:var(--fill-subtle); }
  .nav:active { background:var(--fill-subtle-2); }
  .nav[aria-current="true"] { background:var(--fill-subtle); }
  .nav[aria-current="true"]::before, .subrow[aria-current="true"]::before {
         content:""; position:absolute; left:0; top:50%; width:3px; height:16px; margin-top:-8px; border-radius:2px; background:var(--accent);
         }
  .fresh::before { animation:pill 240ms var(--spring); }
  @keyframes pill { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  .nav .lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav.open .lbl { font-weight:600; }
  .nav .chev { font-size:10px; color:var(--text3); transition:transform .15s; margin-left:-4px; }
  .nav .chev.down { transform:rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .nav .chev { transition:none; } }
  .nav .meta { color:var(--text3); font-size:12px; font-variant-numeric:tabular-nums; }
  .appicon { width:20px; height:20px; border-radius:4px; flex:none; display:grid; place-items:center; object-fit:contain; }
  .appicon.ini { background:var(--fill-subtle); color:var(--text2); font:600 11px var(--font-small); }
  .appicon.def { color:var(--text2); }
  .appicon.lg { width:32px; height:32px; border-radius:6px; font-size:14px; }

  .sub { position:relative; margin:0 0 6px; padding-left:22px; }
  .sub.fresh { animation:fade 200ms var(--out); }
  .sub::before { content:""; position:absolute; left:19px; top:4px; bottom:4px; width:1px; background:var(--divider); }
  .subrow { position:relative; display:flex; align-items:center; gap:10px; width:100%; height:32px; padding:0 8px 0 14px; margin:1px 0;
            border:0; border-radius:4px; background:transparent; text-align:left; font-size:13px; color:var(--text2);
            transition:background-color 120ms var(--out), color 120ms var(--out); }
  .subrow:hover { background:var(--fill-subtle); color:var(--text); }
  .subrow[aria-current="true"] { background:var(--fill-subtle); color:var(--text); font-weight:600; }
  .subrow .lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .subrow .g { font-size:12px; color:var(--text3); }
  .subrow.add { color:var(--text3); }
  .subrow.add:hover { color:var(--text); }
  .subrow[draggable="true"] { cursor:grab; }
  .subrow.dragging { opacity:.4; }
  .subrow.over { box-shadow:inset 0 2px 0 var(--accent); }
  .settings-row { margin-top:4px; }

  /* ---------- content frame ---------- */
  .frame { display:grid; grid-template-columns:minmax(0,1fr) 368px; min-height:0; margin-top:8px;
           background:var(--frame); border:1px solid var(--frame-stroke); border-right:0; border-bottom:0; border-top-left-radius:8px; overflow:hidden; }
  .stage { position:relative; min-width:0; overflow:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 32px 96px; }
  .stage-head { text-align:center; margin-bottom:24px; animation:fade 240ms var(--out); }
  .stage-head h1 { margin:0; font:600 20px/28px var(--font-display); }
  .stage-head p { margin:4px 0 0; color:var(--text2); font-size:13px; }
  .ring { width:min(440px, 100%, calc(100vh - 260px)); min-width:260px; aspect-ratio:1; }
  .ring svg { width:100%; height:100%; display:block; overflow:visible; }
  .ring .body { filter:drop-shadow(0 10px 28px rgba(0,0,0,.07)); }
  .seg path { fill:var(--seg); stroke:var(--seg-stroke); stroke-width:1; cursor:pointer; transition:fill 180ms var(--out); }
  .seg:hover path { fill:var(--seg-hover); }
  .seg.sel path { fill:var(--accent); stroke:var(--accent); }
  .seg text { pointer-events:none; text-anchor:middle; dominant-baseline:central; fill:var(--text); transition:fill 180ms var(--out); }
  .seg .sg { font:14px var(--glyphs); fill:var(--text2); }
  .seg .sl { font:600 12px var(--font-small); }
  .seg.sel text { fill:var(--on-accent); }
  .hub { fill:var(--frame); stroke:var(--seg-stroke); }
  .hub-t { font:600 13px var(--font-small); fill:var(--text); text-anchor:middle; dominant-baseline:central; }
  .hub-s { font:12px var(--font-small); fill:var(--text3); text-anchor:middle; dominant-baseline:central; }
  .stage-hint { margin:20px 0 0; color:var(--text3); font-size:12px; min-height:16px; text-align:center; }
  .empty-ring { display:grid; place-items:center; text-align:center; gap:4px; }
  .empty-ring p { margin:0; color:var(--text2); font-size:13px; max-width:240px; }

  /* ---------- panel ---------- */
  .panel { border-left:1px solid var(--divider); overflow:auto; min-height:0; }
  .pv { padding:20px 24px 28px; animation:enter 200ms var(--out); }
  @keyframes enter { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .pv-top { display:flex; align-items:center; gap:4px; height:32px; margin:0 -8px 16px; }
  .back { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 8px; border:0; border-radius:4px; background:transparent; color:var(--text2); font-size:13px; max-width:60%; }
  .back:hover { background:var(--fill-subtle); color:var(--text); }
  .back .g { font-size:12px; }
  .back span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv-count { margin-left:auto; color:var(--text3); font-size:12px; font-variant-numeric:tabular-nums; }
  .pv-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .pv-head h2 { margin:0; font:600 20px/28px var(--font-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv-head p { margin:0; color:var(--text2); font-size:12px; line-height:16px; }
  .prose { color:var(--text2); font-size:13px; line-height:20px; margin:0 0 20px; }
  .stat { display:flex; align-items:baseline; justify-content:space-between; padding:12px 0; border-top:1px solid var(--divider); border-bottom:1px solid var(--divider); margin-bottom:20px; font-size:13px; }
  .stat b { font:600 20px/28px var(--font-display); font-variant-numeric:tabular-nums; }
  .row-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .danger-zone { margin-top:32px; padding-top:16px; border-top:1px solid var(--divider); }
  .pv-foot { margin-top:28px; padding-top:16px; border-top:1px solid var(--divider); display:flex; align-items:center; gap:12px; }
  .pv-foot .help { color:var(--text3); font-size:12px; line-height:16px; }

  /* macro steps: a quiet timeline */
  .steps { position:relative; display:grid; gap:8px; margin-bottom:12px; }
  .steps::before { content:""; position:absolute; left:13px; top:20px; bottom:20px; width:1px; background:var(--divider); }
  .step { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center; animation:enter 180ms var(--out); }
  .node { position:relative; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--frame);
          border:1px solid var(--stroke); color:var(--text2); }
  .node .g { font-size:12px; }
  .step-acts { display:flex; opacity:0; transition:opacity 140ms var(--out); }
  .step:hover .step-acts, .step:focus-within .step-acts { opacity:1; }
  input.switch { appearance:none; -webkit-appearance:none; flex:none; width:40px; height:20px; border-radius:10px; margin:0; cursor:pointer; position:relative;
    background:transparent; border:1px solid var(--text2); transition:background .15s, border-color .15s; }
  input.switch::before { content:''; position:absolute; left:4px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:var(--text2);
    transition:transform .15s, background .15s, width .15s; }
  input.switch:hover::before { width:14px; margin-top:-7px; }
  input.switch:checked { background:var(--accent); border-color:var(--accent); }
  input.switch:checked::before { background:var(--on-accent, #fff); transform:translateX(20px); }
  input.switch:focus-visible { outline:2px solid var(--text); outline-offset:2px; }

      });
      Object.keys(inc.pages || {}).forEach(function (k) {
        var key = k === '(default)' ? k : (findApp(k) || k);
        cfg.pages[key] = cfg.pages[key] || [];
        (inc.pages[k] || []).forEach(function (p) {
          if (cfg.pages[key].length >= 3) { skipped += (p.items || []).length; return; }
          cfg.pages[key].push({ name: p.name, items: (p.items || []).slice(0, MAX) }); added += Math.min(MAX, (p.items || []).length);
        });
        if (!cfg.pages[key].length) delete cfg.pages[key];
      });
      Object.keys(inc.pageNames || {}).forEach(function (k) { if (!cfg.pageNames[k]) cfg.pageNames[k] = inc.pageNames[k]; });
      note = 'Added ' + added + (added === 1 ? ' tile' : ' tiles') + (skipped ? '; ' + skipped + ' skipped (a ring or set holds ' + MAX + ' tiles, up to 4 sets)' : '');
    }
    saved = keep; selRing = null; selSet = 0; selItem = -1; saveState = 'idle';
    renderAll(); toast(note + '. Review, then Save.', { ms: 5000 });
  }

  function confirm(title, text, yesLabel, yes) {
    var d = $('confirmDlg');
    $('confirmTitle').textContent = title; $('confirmText').textContent = text; $('confirmYes').textContent = yesLabel;
    $('confirmYes').onclick = function () { d.close(); yes(); };
    $('confirmNo').onclick = function () { d.close(); };
    d.showModal(); $('confirmNo').focus();
  }

  // ---------- boot ----------
  function renderAll() { if (selSet >= setCount(selRing)) selSet = 0; renderNav(); renderStage(); renderPanel(); renderSaveBar(); }
  $('addRing').addEventListener('click', openAppDialog);
  $('settingsBtn').addEventListener('click', openSettings);
  $('appSearch').addEventListener('input', renderPicker);
  $('appForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var first = $('picker').querySelector('.pick'); if (first) first.click();
  });
  $('appCancel').addEventListener('click', function () { $('appDialog').close(); });
  $('detectBtn').addEventListener('click', detect);
  $('browseBtn').addEventListener('click', browseApp);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    else if (e.key === 'Escape' && fly) { e.preventDefault(); closeFlyout(true); }
  });
  window.addEventListener('beforeunload', function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  api('/api/config').then(function (data) {
    setCfg(typeof data === 'string' ? JSON.parse(data) : data);
    renderAll();
  }).catch(function (e) {
    document.body.innerHTML = '';
    document.body.style.display = 'grid';
    document.body.style.placeItems = 'center';
    document.body.appendChild(h('p', { 'class': 'muted', style: 'max-width:360px;text-align:center' },
      'Cannot reach RingAction (' + e.message + '). Open the editor from the tray icon.'));
  });
})();
</script>
</body>
</html>
